<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seus Amores Puros</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #fff0f3;
    display: flex;
    justify-content:center;
    align-items:center;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
}
.lock-card {
    background: white;
    padding: 40px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(230,150,170,0.2);
    max-width: 450px;
    width: 90%;
    z-index: 10;
}
.lock-btn {
    font-size: 80px;
    cursor: pointer;
    margin: 20px 0;
    animation: bounce 2s infinite;
    display: inline-block;
}
@keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}
.dica {
    color: #d15175;
    font-style: italic;
    font-size: 15px;
    margin-top: 15px;
}
#conteudo-secreto {
    display: none;
    max-width: 600px;
    width: 90%;
    text-align: center;
    padding: 30px 0;
    animation: fadeIn 1.5s ease-in-out forwards;
}
@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.foto-principal {
    width: 100%;
    max-width: 400px;
    height: auto;
    border-radius: 20px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    border: 6px solid #fff;
    margin-bottom: 30px;
}
.carrossel-container {
    position: relative;
    max-width: 400px;
    margin: 0 auto 40px auto;
    overflow: hidden;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    border: 5px solid #fff;
}
.carrossel-slides {
    display: flex;
    transition: transform 0.5s ease-in-out;
}
.carrossel-slides img {
    width: 100%;
    height: 350px;
    object-fit: cover;
    flex-shrink: 0;
}
.carrossel-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.8);
    border: none;
    font-size: 20px;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 50%;
    color: #d15175;
}
.btn-prev { left: 10px; }
.btn-next { right: 10px; }
.texto-final {
    font-family: 'Comic Sans MS', cursive, sans-serif;
    font-size: 22px;
    color: #b8375d;
    line-height: 1.6;
    background: #fff;
    padding: 25px;
    border-radius: 20px;
    box-shadow: 0 5px 15px rgba(230,150,170,0.15);
}
.confeti {
    position: absolute;
    pointer-events: none;
    z-index: 100;
    animation: voar 1.2s ease-out forwards;
}
@keyframes voar {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) rotate(360deg); opacity: 0; }
}
</style>
</head>
<body>

<div class="lock-card" id="card-trancado">
    <h2 style="color: #b8375d;">Uma última caixinha... 🐾</h2>
    <div class="lock-btn" onclick="abrirTerceiraTela()">🔒</div>
    <p class="dica">Dica: seus dois amores mais puros...</p>
</div>

<div id="conteudo-secreto">
    <!-- Foto 7 abrindo na explosão -->
    <img src="Foto7.png.png" class="foto-principal" alt="Foto Principal">

    <!-- Carrossel com as fotos dos pets e a foto 8 -->
    <div class="carrossel-container">
        <div class="carrossel-slides" id="slides">
            <img src="jully1.jpg.jpeg" alt="Jully 1">
            <img src="jun2.jpg.jpeg" alt="Jun 2">
            <img src="jullyjun.explosao.jpeg" alt="Jully e Jun Explosão">
            <img src="Foto8.jpg.jpeg" alt="Foto 8">
        </div>
        <button class="carrossel-btn btn-prev" onclick="mudarSlide(-1)">❮</button>
        <button class="carrossel-btn btn-next" onclick="mudarSlide(1)">❯</button>
    </div>

    <div class="texto-final">
        "Voce foi a melhor que tivemos, te protegemos e amamos pra sempre mamain!" 💖🐾
    </div>
</div>

<script>
let slideIndex = 0;
function mudarSlide(direcao) {
    const slides = document.getElementById("slides");
    const totalSlides = 4; // Agora são 4 fotos no carrossel dos pets
    slideIndex = (slideIndex + direcao + totalSlides) % totalSlides;
    slides.style.transform = `translateX(${-slideIndex * 100}%)`;
}

window.addEventListener('pageshow', function () {
    document.getElementById("card-trancado").style.display = "block";
    document.getElementById("conteudo-secreto").style.display = "none";
});

function abrirTerceiraTela() {
    let senha = prompt("Digite a senha secreta: 🔑");
    if (senha === null) return;
    let senhaLimpa = senha.trim().toLowerCase();

    if (senhaLimpa === "jullyjun" || senhaLimpa === "jullyejun") {
        criarExplosao();
        document.getElementById("card-trancado").style.display = "none";
        document.getElementById("conteudo-secreto").style.display = "block";
    } else {
        alert("Senha errada! Pense nos seus dois maiores companheirinhos fofos... 🐶🐱");
    }
}

function criarExplosao() {
    const simbolos = ["🌸", "💖", "✨", "🐾", "🎈", "❤️"];
    for (let i = 0; i < 100; i++) {
        const confeti = document.createElement("div");
        confeti.classList.add("confeti");
        confeti.innerHTML = simbolos[Math.floor(Math.random() * simbolos.length)];
        const x = (Math.random() - 0.5) * window.innerWidth;
        const y = (Math.random() - 0.5) * window.innerHeight;
        confeti.style.setProperty('--x', `${x}px`);
        confeti.style.setProperty('--y', `${y}px`);
        confeti.style.left = "50vw";
        confeti.style.top = "50vh";
        confeti.style.fontSize = (15 + Math.random() * 25) + "px";
        document.body.appendChild(confeti);
        setTimeout(() => confeti.remove(), 1200);
    }
}
</script>
</body>
</html>
