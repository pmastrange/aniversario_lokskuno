<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uma surpresa para minha miguxa</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:
linear-gradient(rgba(232,247,234,0.85), rgba(247,255,248,0.85)),
url("https://images.unsplash.com/photo-1522383225653-ed111181a951?auto=format&fit=crop&w=1200&q=80");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

.card{
background:rgba(255,255,255,0.88);
backdrop-filter:blur(10px);
padding:40px;
border-radius:30px;
max-width:650px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.15);
z-index:10;
margin:20px;
border:1px solid rgba(255,255,255,.4);
}

.lock{
font-size:85px;
filter:drop-shadow(0 0 10px rgba(255,215,0,.5));
cursor:pointer;
margin:20px;
animation:pulse 2s infinite;
transition: transform 0.3s;
}

@keyframes pulse{
50%{transform:scale(1.1);}
}

#countdown{
font-size:28px;
font-weight:bold;
color:#4f7b57;
margin-top:25px;
padding:15px;
background:rgba(255,255,255,.5);
border-radius:20px;
}

.petal{
position:fixed;
top:-20px;
animation:fall linear infinite;
pointer-events:none;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(360deg);
}
}
</style>
</head>

<body>

<div class="card">

<h1>🌸 Uma pequena surpresa para minha miguxa 🌸</h1>

<p>
Tem uma surpresa pra você.
Mas ainda não chegou a hora rsrsrs. 💚
</p>

<div class="lock" id="cadeado" onclick="verificarSenha()">
🔒
</div>

<p>Toque no cadeado.</p>

<div id="countdown"></div>
  <p style="margin-top:20px;color:#5d8f66;line-height:1.8;">

🌸 Brasil ↔ Japão 🌸

<br><br>

A chave será entregue no seu aniversário, então fica mais alegre.

</p>
  
</div>

<script>

const targetDate = new Date("2026-06-21T00:00:00");

function updateCountdown(){

const now = new Date();
const diff = targetDate - now;

const days = Math.floor(diff/(1000*60*60*24));
const hours = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
const minutes = Math.floor((diff%(1000*60))/(1000*60));
const seconds = Math.floor((diff%(1000*60))/1000);

document.getElementById("countdown").innerHTML =
`${days} dias • ${hours}h • ${minutes}m • ${seconds}s`;

}

setInterval(updateCountdown,1000);
updateCountdown();

for(let i=0;i<35;i++){

const petal=document.createElement("div");

petal.classList.add("petal");

petal.innerHTML="🌸";

petal.style.left=Math.random()*100+"vw";
petal.style.fontSize=(15+Math.random()*15)+"px";
petal.style.animationDuration=(8+Math.random()*10)+"s";

document.body.appendChild(petal);

}

// --- NOVA FUNÇÃO PARA A SENHA ---
function verificarSenha() {
    // Defina a senha que você quer aqui (coloquei em letras maiúsculas)
    const senhaCorreta = "AMIGA123"; 
    
    // Abre a caixinha perguntando a senha
    let senhaDigitada = prompt("Digite a senha para abrir o cadeado: 🔑");
    
    // Se ela cancelar ou não digitar nada, não faz nada
    if (senhaDigitada === null) return;

    // .toUpperCase() serve para aceitar a senha mesmo se ela digitar com letras minúsculas
    if (senhaDigitada.toUpperCase() === senhaCorreta.toUpperCase()) {
        const cadeado = document.getElementById("cadeado");
        
        // Muda o emoji para aberto
        cadeado.innerHTML = "🔓";
        alert("Senha correta! Abrindo a surpresa... 🎉");
        
        // Espera 1 segundo (1000 milissegundos) para ela ver o cadeado abrir e depois redireciona
        setTimeout(function() {
            window.location.href = 'mensagem.html';
        }, 1000);
    } else {
        alert("Senha incorreta! Hmmm... tenta de novo ou espera o aniversário! 😜");
    }
}

</script>

</body>
</html>
