<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nossas Fotos</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7fcf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
}
.secao-fotos {
    width: 100%;
    max-width: 900px;
    text-align: center;
    margin-bottom: 50px;
}
.spotify-btn {
    background-color: #1DB954;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 40px;
    box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
    animation: pulsarBotao 1.2s infinite alternate;
}
@keyframes pulsarBotao {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(29, 185, 84, 0.7); }
    100% { transform: scale(1.06); box-shadow: 0 0 0 12px rgba(29, 185, 84, 0); }
}
.rolo-filme {
    background: #111;
    padding: 30px 10px;
    display: flex;
    overflow-x: auto;
    gap: 20px;
    border-top: 14px dashed #fff;
    border-bottom: 14px dashed #fff;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    border-radius: 4px;
}
.foto-quadro {
    flex-shrink: 0;
    background: #fff;
    padding: 12px 12px 35px 12px;
    width: 230px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    transform: rotate(calc(var(--r, 0) * 1deg));
}
.foto-quadro img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    filter: sepia(0.15) contrast(1.05);
}
.foto-quadro span {
    display: block;
    margin-top: 12px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    color: #444;
    font-size: 13px;
}
.btn-proximo {
    background: #4f7b57;
    color: white;
    padding: 14px 28px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: 0.3s;
}
.btn-proximo:hover { background: #3d6144; }
</style>
</head>
<body>

<div class="secao-fotos">
    <!-- Link do Spotify funcionando -->
    <a href="https://open.spotify.com/playlist/3fhl0NZ3Tg7ipf1AczB8wg?si=0AB-eHgDT9uUucq4jvzLEw&pi=mYYPIFcvQpqCp" target="_blank" class="spotify-btn">🎵 Ouvir trilha da surpresa 🎵</a>

    <!-- Rolo de filme com os nomes exatos do seu GitHub -->
    <div class="rolo-filme">
        <div class="foto-quadro" style="--r: -2">
            <img src="Fotoescada.jpg.jpeg" alt="Foto Escada">
            <span>MEMORIES 01</span>
        </div>
        <div class="foto-quadro" style="--r: 3">
            <img src="Foto2.jpg.jpeg" alt="Foto 2">
            <span>MEMORIES 02</span>
        </div>
        <div class="foto-quadro" style="--r: -1">
            <img src="Foto3.jpg.jpeg" alt="Foto 3">
            <span>MEMORIES 03</span>
        </div>
        <div class="foto-quadro" style="--r: 4">
            <img src="Foto4.jpg.jpeg" alt="Foto 4">
            <span>MEMORIES 04</span>
        </div>
        <div class="foto-quadro" style="--r: -3">
            <img src="Foto5.png.PNG" alt="Foto 5">
            <span>MEMORIES 05</span>
        </div>
        <div class="foto-quadro" style="--r: 2">
            <img src="Foto6.png.PNG" alt="Foto 6">
            <span>MEMORIES 06</span>
        </div>
    </div>
</div>

<div>
    <!-- Botão que joga para a última tela secreta -->
    <a href="amores.html" class="btn-proximo">Olha... tem mais uma última coisinha! 🐾</a>
</div>

</body>
</html>
