<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nossas Fotos</title>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f7fcf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 20px;
    position: relative;
}
.progress-dots {
    position: absolute;
    top: 20px;
    font-size: 14px;
    letter-spacing: 6px;
    color: #d9b3bb;
}
.progress-dots span { color: #4f7b57; }

.btn-voltar {
    align-self: flex-start;
    color: #6e8a75;
    text-decoration: none;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 20px;
}

.secao-fotos {
    width: 100%;
    max-width: 950px;
    text-align: center;
    margin-bottom: 40px;
}
.spotify-btn {
    background-color: #1DB954;
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 50px;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 30px;
    animation: pulsarBotao 1.2s infinite alternate;
}
@keyframes pulsarBotao {
    0% { transform: scale(1); } 100% { transform: scale(1.05); }
}

/* Rolo de Filme Aprimorado para Mobile */
.rolo-filme {
    background: #111;
    padding: 30px 15px;
    display: flex;
    overflow-x: auto;
    gap: 20px;
    border-top: 14px dashed #fff;
    border-bottom: 14px dashed #fff;
    border-radius: 4px;
    -webkit-overflow-scrolling: touch;
}

/* Scrollbar visível e customizada */
.rolo-filme::-webkit-scrollbar {
    height: 10px;
}
.rolo-filme::-webkit-scrollbar-track {
    background: #222;
}
.rolo-filme::-webkit-scrollbar-thumb {
    background: #4f7b57;
    border-radius: 5px;
}

/* Indicador de Swipe para Mobile */
.swipe-hint {
    color: #888;
    font-size: 13px;
    margin-top: 12px;
    animation: moverSeta 1.5s infinite;
}
@keyframes moverSeta {
    0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); }
}

.foto-quadro {
    flex-shrink: 0;
    background: #fff;
    padding: 12px 12px 35px 12px;
    width: 230px;
    transform: rotate(calc(var(--r, 0) * 1deg));
}
.foto-quadro img {
    width: 100%;
    height: 230px;
    object-fit: cover;
}
.foto-quadro span {
    display: block;
    margin-top: 12px;
    font-family: 'Courier New', monospace;
    font-weight: bold;
    color: #444;
}
.btn-proximo {
    background: #4f7b57;
    color: white;
    padding: 14px 28px;
    border-radius: 30px;
    text-decoration: none;
    font-weight: bold;
    display: inline-block;
}
</style>
</head>
<body>

<div class="progress-dots"><span>● ● ●</span> ○</div>

<a href="mensagem.html" class="btn-voltar">← Voltar para a carta</a>

<div class="secao-fotos">
    <a href="https://open.spotify.com/playlist/3fhl0NZ3Tg7ipf1AczB8wg?si=0AB-eHgDT9uUucq4jvzLEw&pi=mYYPIFcvQpqCp" target="_blank" class="spotify-btn">🎵 Ouvir trilha da surpresa 🎵</a>

    <div class="rolo-filme">
        <div class="foto-quadro" style="--r: -2"><img src="Fotoescada.jpg.jpeg" alt="1"><span>MEMORIES 01</span></div>
        <div class="foto-quadro" style="--r: 3"><img src="Foto2.jpg.jpeg" alt="2"><span>MEMORIES 02</span></div>
        <div class="foto-quadro" style="--r: -1"><img src="Foto3.jpg.jpeg" alt="3"><span>MEMORIES 03</span></div>
        <div class="foto-quadro" style="--r: 4"><img src="Foto4.jpg.jpeg" alt="4"><span>MEMORIES 04</span></div>
        <div class="foto-quadro" style="--r: -3"><img src="Foto5.png.PNG" alt="5"><span>MEMORIES 05</span></div>
        <div class="foto-quadro" style="--r: 2"><img src="Foto6.png.PNG" alt="6"><span>MEMORIES 06</span></div>
        <div class="foto-quadro" style="--r: -1"><img src="Foto7.png.png" alt="7"><span>MEMORIES 07</span></div>
    </div>
    <div class="swipe-hint">Arraste para o lado para ver mais ➔</div>
</div>

<div>
    <a href="amores.html" class="btn-proximo">Olha... tem mais uma última coisinha! 🐾</a>
</div>

</body>
</html>
