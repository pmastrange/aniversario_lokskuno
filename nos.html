<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nós miguxa</title>

<style>

body{
margin:0;
padding:30px;
font-family:Arial,sans-serif;
background:
linear-gradient(rgba(232,247,234,0.92), rgba(247,255,248,0.92)),
url("https://images.unsplash.com/photo-1522383225653-ed111181a951?auto=format&fit=crop&w=1200&q=80");
background-size:cover;
background-position:center;
text-align:center;
}

h1{
color:#5d8f66;
margin-bottom:10px;
}

.sub{
color:#4f7b57;
margin-bottom:35px;
font-size:18px;
}

.galeria{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
max-width:1200px;
margin:auto;
}

.galeria img{
width:100%;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
transition:.3s;
}

.galeria img:hover{
transform:scale(1.03);
}

.mensagem{
max-width:800px;
margin:40px auto;
background:rgba(255,255,255,.88);
padding:25px;
border-radius:20px;
line-height:1.8;
box-shadow:0 10px 25px rgba(0,0,0,.1);
}

.botao{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#5d8f66;
color:white;
text-decoration:none;
border-radius:30px;
}

</style>
</head>

<body>

<h1>🌸 Nós 🌸</h1>

<p class="sub">
Algumas das minhas memórias favoritas têm você nelas.
</p>

<div class="galeria">

<img src="Fotoescada.jpg.jpeg">
<img src="Foto2.jpg.jpeg">
<img src="Foto3.jpg.jpeg">
<img src="Foto4.jpg.jpeg">

</div>

<div class="mensagem">

<p>
Vê se a josé faz isso.
</p>

<p>
Cada foto guarda uma lembrança, uma conversa, uma risada... volte logo!
</p>

<p>
E ainda temos muitas memórias para criar juntas.
</p>

<p>
Brasil ↔ Japão
</p>

</div>

<a class="botao" href="mensagem.html">
← Voltar para a carta
</a>

</body>
</html>
