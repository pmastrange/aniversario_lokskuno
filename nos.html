<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nós</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#e8f7ea,#f7fff8);
padding:20px;
text-align:center;
}

h1{
color:#5d8f66;
margin-top:30px;
}

p{
color:#4f7b57;
font-size:18px;
line-height:1.8;
}

.galeria{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
max-width:1000px;
margin:40px auto;
}

.galeria img{
width:100%;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
transition:.3s;
}

.galeria img:hover{
transform:scale(1.03);
}

.voltar{
margin-top:30px;
}

a{
text-decoration:none;
color:#5d8f66;
font-weight:bold;
}

</style>

</head>

<body>

<h1>🌸 Nós 🌸</h1>

<p>
Algumas das minhas memórias favoritas têm você nelas.
</p>

<div class="galeria">

<img src="FOTO1.jpg">
<img src="FOTO2.jpg">
<img src="FOTO3.jpg">
<img src="FOTO4.jpg">

</div>

<div class="voltar">
<a href="mensagem.html">← Voltar</a>
</div>

</body>
</html>
